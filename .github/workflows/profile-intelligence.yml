name: Profile intelligence
on:
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/profile-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-intelligence.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original SVGs and intelligence renderer
        run: |
          python -m unittest discover -s scripts -v
          python -c "import pathlib, re, xml.etree.ElementTree as E; paths=re.findall(r'src=\"(assets/[^\"]+)\"', pathlib.Path('README.md').read_text()); assert paths; [E.parse(p) for p in paths]"
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: profile-intelligence-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real public data and render
        run: python scripts/refresh_intelligence.py
      - name: Commit refreshed snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/obsidian-intelligence.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public GitHub intelligence"
          git push
